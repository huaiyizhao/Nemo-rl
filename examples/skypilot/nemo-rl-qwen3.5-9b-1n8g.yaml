name: nemo-rl-qwen3-5-9b-1n8g

# This file is self-contained: the launch machine does not need a NeMo-RL
# checkout. Start it from any directory with:
#   sky launch -c nemo-rl-qwen35 nemo-rl-qwen3.5-9b-1n8g.yaml -y
resources:
  accelerators: H200:8
  cpus: 64+
  memory: 256+
  # Derived from the NeMo-RL v0.6.0 image with a SkyPilot 0.11 runtime fix.
  image_id: docker:028236335745.dkr.ecr.us-east-2.amazonaws.com/galileo/nemo:v0.6-skyfix

num_nodes: 1

setup: |
  set -euo pipefail
  test -d /host-ssd
  test -w /host-ssd
  test -d /root/Nemo-rl/.git || \
    git clone --branch local --single-branch \
      https://github.com/huaiyizhao/Nemo-rl.git /root/Nemo-rl
  bash /root/Nemo-rl/examples/skypilot/start-nemo-ray.sh

run: |
  set -euo pipefail
  echo "NeMo-RL node is ready. Connect with: sky ssh <cluster-name>"
  echo "Fork checkout: /root/Nemo-rl (branch: local)"
  echo "Smoke test: bash /root/Nemo-rl/examples/skypilot/run-qwen35-smoke.sh"
  echo "VLM GRPO: bash /root/Nemo-rl/examples/skypilot/run-vlm-grpo-qwen35-geo3k.sh"
